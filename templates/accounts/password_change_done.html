{% extends 'dashboard/base_dashboard.html' %}
{% load static i18n %}

{% block page_content %}
<div style="max-width: 560px; margin: 0 auto; text-align: center;">
    <div class="data-table-card">
        <div class="card-body" style="padding: var(--space-10);">
            <div class="success-state">
                <div class="success-icon">
                    <i data-lucide="check-circle" style="width: 48px; height: 48px;"></i>
                </div>
                <h2 class="success-title">{% trans "Password Changed" %}</h2>
                <p class="success-message">{% trans "Your password has been successfully updated." %}</p>
            </div>

            <div style="display: flex; gap: var(--space-3); justify-content: center; margin-top: var(--space-6);">
                <a href="{% url 'accounts:profile' %}" class="btn btn-primary">
                    <i data-lucide="user" class="btn-icon"></i>
                    {% trans "My Profile" %}
                </a>
                <a href="{% url 'dashboard:admin_dashboard' %}" class="btn btn-outline">
                    <i data-lucide="layout-dashboard" class="btn-icon"></i>
                    {% trans "Dashboard" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
